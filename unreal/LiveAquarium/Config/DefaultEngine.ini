[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/LookTest/Maps/Reef.Reef
GameDefaultMap=/Game/LookTest/Maps/Reef.Reef
; игра пробы: рыба игрока, акула-охотник, живые стайки (Source/LiveAquarium)
GlobalDefaultGameMode=/Script/LiveAquarium.AquariumGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Nanite и виртуальные тени требуют SM6; на SM5 Nanite рисует упрощённые запасные меши
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, no baked lighting
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
; software Lumen first; hardware RT can be tried later (VRAM is tight on 8 GB)
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
; exposure is set by the post process volume, not by the project default
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.VolumetricFog=1

[/Script/Engine.UserInterfaceSettings]
; игра рендерит в родном разрешении экрана (при масштабе Windows 125% без этого — 1536x864 и растяжка)
bAllowHighDPIInGameMode=True

[SystemSettings]
; сообщение о переполнении очереди разметки не-Nanite мешей в виртуальных тенях (≈50 мелких рыб) —
; безвредно (очередь в шейдере фиксированная, дальше медленный путь), но закрывает экран в Development-сборке
r.Shadow.Virtual.AllowScreenOverflowMessages=0
; RTX 4060 Laptop, 8 GB: keep texture streaming well inside VRAM
r.Streaming.PoolSize=3000

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bDeveloperMode=True
bRemoteExecution=True
