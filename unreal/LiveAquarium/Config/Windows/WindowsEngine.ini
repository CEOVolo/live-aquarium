[Audio]
; Живой звуковой поток Unreal на этом ноутбуке обваливает Wi-Fi (скачивание 100 -> 7 Мбит/с,
; отдача -> 0). С модулем WASAPI (по умолчанию в 5.8) — всё время, пока открыт редактор;
; с XAudio2 — только во время игры/рендера (PIE). Полностью — только без звука (-nosound,
; unreal/scripts/open_editor.ps1). Подробности — docs/UNREAL_LOOKTEST.md.
AudioMixerModuleName=AudioMixerXAudio2
